[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ledger-inbox"
version = "0.1.0"
description = "A multi-tenant, channel-agnostic image inbox for extensible bookkeeping automation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Keith Jones" }]
keywords = ["bookkeeping", "automation", "ocr", "email", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
ledger-inbox = "ledger_inbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_inbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
